services:
  database:
    image: ghcr.io/cole-titze/nhl-odds/database:latest
    restart: always
    environment:
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your environment}
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/1433'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  webapi:
    image: ghcr.io/cole-titze/nhl-odds/webapi:latest
    restart: always
    environment:
      - NHL_DATABASE=Server=database;Database=nhl;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      - ODDS_API_KEY=${ODDS_API_KEY:-}
      - API_BACKFILL_KEY=${API_BACKFILL_KEY:-}
    depends_on:
      database:
        condition: service_healthy

  frontend:
    image: ghcr.io/cole-titze/nhl-odds/frontend:latest
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - webapi

volumes:
  sql-data:
