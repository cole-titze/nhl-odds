name: nhl-odds

services:
  database:
    image: ghcr.io/cole-titze/nhl-odds/database:latest
    restart: always
    environment:
      - TZ=America/Chicago
      - POSTGRES_DB=nhl
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nhl"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  webapi:
    image: ghcr.io/cole-titze/nhl-odds/webapi:latest
    restart: always
    environment:
      - TZ=America/Chicago
      - NHL_DATABASE=Host=database;Database=nhl;Username=postgres;Password=${POSTGRES_PASSWORD}
    depends_on:
      database:
        condition: service_healthy

  entry:
    image: ghcr.io/cole-titze/nhl-odds/entry:latest
    profiles: ["jobs"]
    environment:
      - TZ=America/Chicago
      - NHL_DATABASE=Host=database;Database=nhl;Username=postgres;Password=${POSTGRES_PASSWORD}
      - ODDS_API_KEY=${ODDS_API_KEY:-}
      - API_BACKFILL_KEY=${API_BACKFILL_KEY:-}
    depends_on:
      database:
        condition: service_healthy

  predictor:
    image: ghcr.io/cole-titze/nhl-odds/predictor:latest
    profiles: ["jobs"]
    cpus: ${PREDICTOR_CPUS:-2}
    environment:
      - TZ=America/Chicago
      - NHL_DATABASE=Host=database;Database=nhl;Username=postgres;Password=${POSTGRES_PASSWORD}
    depends_on:
      database:
        condition: service_healthy

  scheduler:
    image: ghcr.io/cole-titze/nhl-odds/scheduler:latest
    restart: always
    environment:
      - TZ=America/Chicago
      - COMPOSE_FILE=/compose/docker-compose.yml
      - NHL_DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@database:5432/nhl
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/compose:ro
    depends_on:
      database:
        condition: service_healthy

  frontend:
    image: ghcr.io/cole-titze/nhl-odds/frontend:latest
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - webapi

volumes:
  pg-data:
