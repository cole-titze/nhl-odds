name: Security Scan

on:
  schedule:
    - cron: '0 10 * * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REPO: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Trivy itself; the action is pinned separately below. Bump both together.
  TRIVY_VERSION: v0.76.0

jobs:
  # Downloads Trivy and its vulnerability DB once and caches them, so the scan
  # jobs below all restore the cache instead of racing to save it
  prime-cache:
    # The images are arm64-only, and Trivy scans the host's platform
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Cache Trivy and its DB
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        # Only fetch the DB; scanning the empty workspace warns "Supported files not found"
        env:
          TRIVY_DOWNLOAD_DB_ONLY: true
        with:
          scan-type: fs
          scan-ref: .
          version: ${{ env.TRIVY_VERSION }}

  scan:
    needs: prime-cache
    # Matches the images' platform so the image layers pull natively
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: [database, webapi, frontend, entry, predictor, scheduler, scheduler-k8s]

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        # The images are arm64-only. Without a platform, Trivy looks for
        # linux/amd64 in the image index even on an arm runner and fails
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.REGISTRY }}/${{ env.REPO }}/${{ matrix.image }}:latest
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
