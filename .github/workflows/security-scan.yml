name: Security Scan

on:
  schedule:
    - cron: '0 10 * * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REPO: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Trivy itself; the action is pinned separately below. Bump both together.
  TRIVY_VERSION: v0.75.0

jobs:
  # Downloads Trivy and its vulnerability DB once and caches them, so the scan
  # jobs below all restore the cache instead of racing to save it
  prime-cache:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Cache Trivy and its DB
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          version: ${{ env.TRIVY_VERSION }}

  scan:
    needs: prime-cache
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        image: [database, webapi, frontend, entry, predictor, scheduler, scheduler-k8s]

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: ${{ env.REGISTRY }}/${{ env.REPO }}/${{ matrix.image }}:latest
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
