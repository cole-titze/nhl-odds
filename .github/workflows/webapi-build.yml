name: Web API Container

on:
  push:
    branches: [main]
    paths:
      - 'src/WebApi/**'
      - 'src/DatabaseAccess/**'
      - 'src/Entities/**'
      - 'nhl-odds.sln'
      - '.github/workflows/webapi-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/WebApi/**'
      - 'src/DatabaseAccess/**'
      - 'src/Entities/**'
      - 'nhl-odds.sln'
      - '.github/workflows/webapi-build.yml'
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/webapi
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    # Native arm64: the cluster is all Raspberry Pis, so there's no amd64 image to build
    runs-on: ubuntu-24.04-arm
    # A hung build fails here instead of after the 6 h default
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/WebApi/Dockerfile
          platforms: linux/arm64
          # Reuse unchanged layers (dependency installs) between runs; the weekly
          # scheduled build starts clean so base images and OS packages update
          cache-from: type=gha,scope=webapi
          cache-to: type=gha,mode=max,scope=webapi
          no-cache: ${{ github.event_name == 'schedule' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
