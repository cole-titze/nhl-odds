name: Unit Tests

on:
  # On main, Entry Container and Web API Container run this as a gate for src/,
  # so a push only runs it for test-only changes
  push:
    branches: [main]
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '!src/**'
      - '.github/workflows/unit-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - 'nhl-odds.sln'
      - '.github/workflows/unit-tests.yml'
  workflow_dispatch:
  # The image workflows run these as promotion gates
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test --verbosity normal
