name: Format Check

on:
  push:
    branches: [main]
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '.editorconfig'
      - 'frontend/**'
      - 'game_predictor/**'
      - '.github/workflows/format-check.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '.editorconfig'
      - 'frontend/**'
      - 'game_predictor/**'
      - '.github/workflows/format-check.yml'
  workflow_dispatch:

jobs:
  dotnet:
    name: .NET Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Check formatting
        run: dotnet format style --verify-no-changes

  frontend:
    name: Frontend Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  python:
    name: Python Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff format --check game_predictor/

      - name: Check linting
        run: ruff check game_predictor/
