name: Accessibility

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/accessibility.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/accessibility.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  axe:
    # axe's WCAG rules run in the Chromium job; the focus, scroll and reflow
    # checks run in all three, since those behave differently per engine
    name: a11y scan (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build
        run: npm run build

      - name: Run a11y scan
        run: npm run a11y
        env:
          A11Y_BROWSERS: ${{ matrix.browser }}
