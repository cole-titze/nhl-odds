name: Accessibility

# No push trigger: on main, Frontend Container runs this as its promotion gate
on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/accessibility.yml'
  workflow_dispatch:
  # The image workflows run these as promotion gates
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # The scans run in Playwright's image, which has every browser and its system
  # libraries; installing those on the runner took up to 12 minutes of apt
  playwright:
    name: Playwright version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: frontend/package-lock.json
          sparse-checkout-cone-mode: false

      - name: Read version from package-lock.json
        id: version
        run: echo "version=$(jq -r '.packages["node_modules/playwright"].version' frontend/package-lock.json)" >> "$GITHUB_OUTPUT"

  axe:
    # axe's WCAG rules run in Chromium only, split over four jobs by theme (it's
    # ~112 page scans); the focus, scroll and reflow checks run in all three
    # browsers, since those behave differently per engine
    name: a11y scan (${{ matrix.name }})
    needs: playwright
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'axe 1/4', browser: chromium, parts: axe, shard: 1/4 }
          - { name: 'axe 2/4', browser: chromium, parts: axe, shard: 2/4 }
          - { name: 'axe 3/4', browser: chromium, parts: axe, shard: 3/4 }
          - { name: 'axe 4/4', browser: chromium, parts: axe, shard: 4/4 }
          - { name: chromium, browser: chromium, parts: checks, shard: 1/1 }
          - { name: firefox, browser: firefox, parts: checks, shard: 1/1 }
          - { name: webkit, browser: webkit, parts: checks, shard: 1/1 }
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run a11y scan
        run: npm run a11y
        env:
          A11Y_BROWSERS: ${{ matrix.browser }}
          A11Y_PARTS: ${{ matrix.parts }}
          A11Y_AXE_SHARD: ${{ matrix.shard }}
          # Firefox won't start as root when HOME (/github/home) belongs to another user
          HOME: /root
