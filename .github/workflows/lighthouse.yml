name: Lighthouse

# No push trigger: on main, Frontend Container runs this as its promotion gate.
# The weekly live-site report runs on the backup Pi instead (ansible-setup's
# homelab-weekly-lighthouse timer): Cloudflare answers GitHub's runners with 403s.
on:
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/lighthouse.yml'
  workflow_dispatch:
  # Frontend Container runs this as a promotion gate
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Chromium comes from Playwright's image, like the a11y scan, instead of an install on the runner
  playwright:
    name: Playwright version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: frontend/package-lock.json
          sparse-checkout-cone-mode: false

      - name: Read version from package-lock.json
        id: version
        run: echo "version=$(jq -r '.packages["node_modules/playwright"].version' frontend/package-lock.json)" >> "$GITHUB_OUTPUT"

  lighthouse:
    # Gate: fails if any page's SEO score is under 95 (the other categories only warn)
    name: Lighthouse (build)
    needs: playwright
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright.outputs.version }}-noble
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    env:
      # Each page once: SEO, the only gated score, is the same every run; more runs only steady
      # performance, which just warns
      LIGHTHOUSE_RUNS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse
        run: npm run lighthouse

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: frontend/lighthouse/reports/
          if-no-files-found: ignore
          retention-days: 30
