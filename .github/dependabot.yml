# Weekly dependency PRs: one PR per ecosystem for minor/patch updates (merged
# automatically by dependabot-merge.yml once CI passes) and one for majors (the
# "-majors" groups, handled by the k8s-major-upgrade skill). Grouping majors also
# stops Dependabot from opening one PR per project for the same bump. Majors that
# track the .NET, Node or Postgres version are ignored and upgraded on purpose.
# game_predictor/requirements*.txt is unpinned (prod installs the latest on
# every image build), so pip has nothing for Dependabot to bump.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        update-types: [minor, patch]
      nuget-majors:
        update-types: [major]
    ignore:
      # 8.x moved to a license that's free only for non-commercial use
      - dependency-name: "FluentAssertions"
        versions: [">=8"]
      - dependency-name: "Microsoft.*"
        update-types: [version-update:semver-major]
      - dependency-name: "Npgsql*"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        update-types: [minor, patch]
      npm-majors:
        update-types: [major]
    ignore:
      # Types follow the Node major the frontend builds with (node:24 in the Dockerfile)
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directories:
      - /database
      - /frontend
      - /game_predictor
      - /scheduler
      - /scheduler/k8s
      - /src/Entry
      - /src/WebApi
    schedule:
      interval: weekly
    groups:
      docker:
        update-types: [minor, patch]
        exclude-patterns: ["python"]  # a new Python minor gets its own PR; the local venv follows it
    ignore:
      - dependency-name: "*dotnet/*"
        update-types: [version-update:semver-major]
      - dependency-name: "node"
        update-types: [version-update:semver-major]
      - dependency-name: "postgres"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
