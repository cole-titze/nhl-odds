# Trivy ignore list, used by .github/workflows/security-scan.yml.
#
# gosu (database image, inherited from the official postgres image): built with an old Go
# stdlib. gosu only switches to the postgres user at container start and execs postgres; it
# never touches TLS, x509, net/url, net/http, mail, mime, XML, templates or os.Root, so these
# stdlib CVEs are unreachable. Scoped to the gosu path so the same CVEs still fail elsewhere.
vulnerabilities:
  - id: CVE-2025-68121
    paths: ["usr/local/bin/gosu"]
    statement: gosu stdlib CVE, unreachable (privilege drop only)
  - id: CVE-2025-61726
    paths: ["usr/local/bin/gosu"]
    statement: gosu stdlib CVE, unreachable (privilege drop only)
