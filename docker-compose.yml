services:
  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    restart: always
    environment:
      - POSTGRES_DB=nhl
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nhl"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  webapi:
    build:
      context: .
      dockerfile: WebApi/Dockerfile
    restart: always
    environment:
      - NHL_DATABASE=Host=database;Database=nhl;Username=postgres;Password=${POSTGRES_PASSWORD}
    depends_on:
      database:
        condition: service_healthy

  entry:
    build:
      context: .
      dockerfile: Entry/Dockerfile
    profiles: ["jobs"]
    environment:
      - NHL_DATABASE=Host=database;Database=nhl;Username=postgres;Password=${POSTGRES_PASSWORD}
      - ODDS_API_KEY=${ODDS_API_KEY:-}
      - API_BACKFILL_KEY=${API_BACKFILL_KEY:-}
    depends_on:
      database:
        condition: service_healthy

  predictor:
    build:
      context: ./game_predictor
      dockerfile: Dockerfile
    profiles: ["jobs"]
    environment:
      - NHL_DATABASE=Host=database;Database=nhl;Username=postgres;Password=${POSTGRES_PASSWORD}
    depends_on:
      database:
        condition: service_healthy

  scheduler:
    build:
      context: ./scheduler
      dockerfile: Dockerfile
    restart: always
    environment:
      - COMPOSE_FILE=/compose/docker-compose.yml
      - NHL_DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@database:5432/nhl
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/compose:ro
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - webapi

volumes:
  pg-data:
