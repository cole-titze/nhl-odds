name: nhl-odds

services:
  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    restart: always
    environment:
      - POSTGRES_DB=nhl
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nhl"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  webapi:
    build:
      context: .
      dockerfile: src/WebApi/Dockerfile
    restart: always
    environment:
      - NHL_DATABASE=Host=database;Database=nhl;Username=postgres;Password=${POSTGRES_PASSWORD}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      # Site search: set ELASTICSEARCH_URL=http://elasticsearch:9200 and start with --profile search
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-}
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:-}
      # Semantic article search: EMBEDDING_URL=http://embeddings:11434 (the embeddings service below)
      - EMBEDDING_URL=${EMBEDDING_URL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
    depends_on:
      database:
        condition: service_healthy

  entry:
    build:
      context: .
      dockerfile: src/Entry/Dockerfile
    profiles: ["jobs"]
    environment:
      - NHL_DATABASE=Host=database;Database=nhl;Username=postgres;Password=${POSTGRES_PASSWORD}
      - ODDS_API_KEY=${ODDS_API_KEY:-}
      - API_BACKFILL_KEY=${API_BACKFILL_KEY:-}
      - THROTTLE_TIME_MS=${THROTTLE_TIME_MS:-250}
      - ELASTICSEARCH_URL=${ELASTICSEARCH_URL:-}
      - ELASTICSEARCH_USERNAME=elastic
      - ELASTICSEARCH_PASSWORD=${ELASTIC_PASSWORD:-}
      # Semantic article search: EMBEDDING_URL=http://embeddings:11434 (the embeddings service below)
      - EMBEDDING_URL=${EMBEDDING_URL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-nomic-embed-text}
    depends_on:
      database:
        condition: service_healthy

  predictor:
    build:
      context: ./game_predictor
      dockerfile: Dockerfile
    profiles: ["jobs"]
    environment:
      - NHL_DATABASE=Host=database;Database=nhl;Username=postgres;Password=${POSTGRES_PASSWORD}
    depends_on:
      database:
        condition: service_healthy

  scheduler:
    build:
      context: ./scheduler
      dockerfile: Dockerfile
    restart: always
    environment:
      - TZ=America/Chicago
      - COMPOSE_FILE=/compose/docker-compose.yml
      - NHL_DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD}@database:5432/nhl
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/compose:ro
    depends_on:
      database:
        condition: service_healthy

  # Site search, optional: ELASTIC_PASSWORD=... ELASTICSEARCH_URL=http://elasticsearch:9200 docker compose --profile search up,
  # then fill it with RUN_MODE=SearchIndex docker compose run entry. Locally everything logs in as the elastic
  # superuser; production uses least-privilege users (ansible-setup).
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    profiles: ["search"]
    restart: always
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
      - node.store.allow_mmap=false
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - xpack.ml.enabled=false
      - ingest.geoip.downloader.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-}
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  # Article embeddings for semantic search, optional (same search profile; set EMBEDDING_URL=http://embeddings:11434).
  # A small model on the CPU, like the cluster runs; pulled on first start into the volume.
  embeddings:
    image: ollama/ollama:0.40.15
    profiles: ["search"]
    restart: always
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    entrypoint: ["sh", "-c", "ollama serve & until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull ${EMBEDDING_MODEL:-nomic-embed-text} && wait"]
    volumes:
      - ollama-models:/root/.ollama

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8081:8080"
    depends_on:
      - webapi

volumes:
  pg-data:
  es-data:
  ollama-models:
