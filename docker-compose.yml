services:
  database:
    build:
      context: ./database
      dockerfile: Dockerfile
    restart: always
    environment:
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in your environment}
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  webapi:
    build:
      context: .
      dockerfile: WebApi/Dockerfile
    restart: always
    environment:
      - NHL_DATABASE=Server=database;Database=nhl;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      - ODDS_API_KEY=${ODDS_API_KEY:-}
      - API_BACKFILL_KEY=${API_BACKFILL_KEY:-}
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8081:80"
    depends_on:
      - webapi

volumes:
  sql-data:
